; agri-uv-bringup — sensor-only prototype for the DFRobot SEN0636 UV Index
; sensor (240-370 nm, UV/UVA/UVB/UVC). Two LCD hosts, one shared source:
;   - m5basic-uv-lcd : M5Stack Basic (Gray), roomy 320x240 for the bench.
;   - atoms3r-uv-lcd : M5 AtomS3R, pocketable 128x128 — closer to the final
;                      node form factor.
; The real target is still an ATOM PoE node (agri-uv-poe / agri-uv-wifi) once
; that hardware arrives; the sensor code ports over 1:1.
;
; Protocol (both hosts): Modbus RTU, 9600 8N1, slave 0x23
;   input reg 0x06 = UV raw (mV, 0-3300)
;   input reg 0x07 = UV Index (0-11)
;   input reg 0x08 = Risk Level (0-4 = Low/Moderate/High/Very High/Extreme)
;
; The DFRobot SEN0636 must be in UART mode (slide the mode switch → UART).
; UART pins differ per host and are passed in as UV_UART_RX / UV_UART_TX;
; main.cpp picks its display layout from the detected screen width.

[env]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Strips the bogus `#include "String.h"` in the DFRobot UV library once
; the deps are fetched — see patch_dfrobot.py.
extra_scripts = pre:patch_dfrobot.py

lib_deps =
	m5stack/M5Unified@^0.2.7
	https://github.com/DFRobot/DFRobot_RTU.git
	https://github.com/DFRobot/DFRobot_UVIndex240370Sensor.git

; --- M5Stack Basic ----------------------------------------------------------
; Wiring (Port C / UART2 → sensor 4-pin)
;   G16 (U2RXD) ← sensor pin 2 (C/T = sensor TX)
;   G17 (U2TXD) → sensor pin 1 (D/R = sensor RX)
;   5V           → sensor pin 3
;   GND          → sensor pin 4
[env:m5basic-uv-lcd]
board = m5stack-core-esp32
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DUV_UART_RX=16
	-DUV_UART_TX=17

; --- M5 AtomS3R -------------------------------------------------------------
; AtomS3R has no USB-serial chip, so Serial debug rides USB-CDC
; (ARDUINO_USB_CDC_ON_BOOT=1). The m5stack-atoms3 board profile fits AtomS3R;
; M5Unified probes the real hardware at M5.begin and drives the GC9107 128x128.
;
; Wiring (Grove Port / UART2 → sensor 4-pin)
;   G1 (U2RXD)  ← sensor pin 2 (C/T = sensor TX)
;   G2 (U2TXD)  → sensor pin 1 (D/R = sensor RX)
;   5V           → sensor pin 3
;   GND          → sensor pin 4
[env:atoms3r-uv-lcd]
board = m5stack-atoms3
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DUV_UART_RX=1
	-DUV_UART_TX=2
